[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sqlfs"
dynamic = ["version"]
description = "fsspec adapter backed by SQL"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fsspec>=2024",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "prek>=0.4.9",
    "commitizen>=4.16.2",
    "psycopg[binary]>=3.2",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "testcontainers[postgres]>=4.9",
    "ty>=0.0.1a5",
    "hatch>=1.16.5",
    "hatch-vcs>=0.5.0",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "scm"
version_schema = "semver"
tag_format = "v$version"
update_changelog_on_bump = true

[tool.hatch.build.hooks.vcs]
version-file = "src/sqlfs/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlfs"]

[tool.hatch.version]
source = "vcs"


[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["src/sqlfs/_version.py"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "PL", "UP", "RUF"]
