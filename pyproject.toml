[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sqlfs"
dynamic = ["version"]
description = "fsspec adapter backed by SQL"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fsspec>=2024",
]

[dependency-groups]
dev = [
    "prek>=0.4.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "ty>=0.0.1a5",
    "hatch>=1.16.5",
    "hatch-vcs>=0.5.0",
]

[tool.hatch.build.hooks.vcs]
version-file = "src/sqlfs/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlfs"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.vcs]
tag = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "PL", "UP", "RUF"]
