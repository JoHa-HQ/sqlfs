name: GitHub Release

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PUBLISHING_PAT }}

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"

      - run: uv sync --group dev
      - name: Extract ticket ID from latest commit
        run: |
          TICKET_ID=$(git log -1 --pretty=format:"%s" | grep -oE "#[0-9]+" | head -1)
          if [ -z "$TICKET_ID" ]; then
            echo "No ticket ID found in latest commit. Aborting."
            exit 1
          fi
          echo "TICKET_ID=$TICKET_ID" >> "$GITHUB_ENV"
          echo "ticket_id=$TICKET_ID"

      - name: Bump version, changelog, and tag
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if ! OUTPUT=$(uv run cz bump --yes --changelog --bump-message "chore(${{ env.TICKET_ID }}): release \$new_version [skip ci]" 2>&1); then
            echo "$OUTPUT"

            if echo "$OUTPUT" | grep -q "NO_COMMITS_TO_BUMP"; then
              echo "No eligible commits to release. Skipping."
              echo "version=none" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            exit 1
          fi

          echo "$OUTPUT"

          VERSION=$(git describe --tags --abbrev=0)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "next_version=$VERSION"

          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$VERSION" ]; then
            FEATURES=$(git log --no-merges --pretty=format:"- %s" "$PREV_TAG..HEAD~1" || true)
          else
            FEATURES="No previous tag found."
          fi
          [ -z "$FEATURES" ] && FEATURES="- No conventional changes since last release."

          git commit --amend \
            -m "chore(${{ env.TICKET_ID }}): release $VERSION [skip ci]" \
            -m "Features deployed:" \
            -m "$FEATURES"

          git tag -f "$VERSION"

          git push origin HEAD
          git push origin "$VERSION" --force

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    needs: tag
    if: ${{ needs.tag.outputs.version != 'none' && needs.tag.outputs.version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.version }}

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"

      - run: uv sync --group dev

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate release notes
        run: uv run cz changelog "${{ needs.tag.outputs.version }}" > RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.PUBLISHING_PAT }}
        run: |
          gh release create "${{ needs.tag.outputs.version }}" \
            --title "Release ${{ needs.tag.outputs.version }}" \
            --notes-file RELEASE_NOTES.md \
            dist/*

  publish:
    needs: [tag, release]
    if: ${{ needs.tag.outputs.version != 'none' && needs.tag.outputs.version != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.tag.outputs.version }}

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"

      - run: uv sync --group dev

      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        env:
          UV_PUBLISH_URL: https://upload.pypi.org/legacy/
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish dist/*
